<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDC Search</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3347;
  --text:#e8eaf2;--muted:#7b82a0;--accent:#4f7cff;--mono:'Courier New',monospace;
  --kbank:#1e8a4a;--kbank-bg:#0d2e1a;--kbank-t:#4dbb78;
  --wom:#7c3aed;--wom-bg:#1e1040;--wom-t:#a78bfa;
  --scb:#4a3fb5;--scb-bg:#1a1650;--scb-t:#9b8fff;
  --bbl:#b54040;--bbl-bg:#2e1515;--bbl-t:#f07070;
  --bay:#c47c1e;--bay-bg:#2e1f0a;--bay-t:#f0a840;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:700;color:var(--accent)}.logo span{color:var(--text)}
.ub{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface2);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.sw{padding:20px 20px 12px;max-width:980px;margin:0 auto}
.sb{position:relative}
.sb svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px 12px 44px;font-size:15px;color:var(--text);outline:none;transition:border-color .15s}
#q::placeholder{color:var(--muted)}#q:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{cursor:pointer;border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);transition:all .15s;user-select:none}
.pill.ak{background:var(--kbank-bg);border-color:var(--kbank);color:var(--kbank-t)}
.pill.aw{background:var(--wom-bg);border-color:var(--wom);color:var(--wom-t)}
.pill.as{background:var(--scb-bg);border-color:var(--scb);color:var(--scb-t)}
.pill.ab{background:var(--bbl-bg);border-color:var(--bbl);color:var(--bbl-t)}
.pill.ay{background:var(--bay-bg);border-color:var(--bay);color:var(--bay-t)}
.pill.aa{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.loading{opacity:.5;pointer-events:none}
.stats{max-width:980px;margin:0 auto;padding:0 20px 10px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.stats strong{color:var(--text)}
.results{max-width:980px;margin:0 auto;padding:0 20px 40px;display:flex;flex-direction:column;gap:12px}
/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;letter-spacing:.5px}
.b-KBANK{background:var(--kbank-bg);color:var(--kbank-t);border:1px solid var(--kbank)}
.b-WOM{background:var(--wom-bg);color:var(--wom-t);border:1px solid var(--wom)}
.b-SCB{background:var(--scb-bg);color:var(--scb-t);border:1px solid var(--scb)}
.b-BBL{background:var(--bbl-bg);color:var(--bbl-t);border:1px solid var(--bbl)}
.b-BAY{background:var(--bay-bg);color:var(--bay-t);border:1px solid var(--bay)}
.tid-lbl{font-size:15px;font-weight:700;font-family:var(--mono)}
.mer-lbl{margin-left:auto;font-size:12px;color:var(--muted)}
.card-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sec-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;font-weight:600}
/* info grid */
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px 16px}
.ii label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:2px}
.ii .v{font-size:12px;font-weight:500;font-family:var(--mono);color:var(--text);word-break:break-all}
.ii .v.e{color:var(--muted);font-family:inherit;font-weight:400;font-style:italic}
/* fn tags */
.fn-row{display:flex;flex-wrap:wrap;gap:6px}
.fn{font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px}
.fn.on{background:rgba(79,124,255,.18);color:#7da4ff;border:1px solid rgba(79,124,255,.3)}
.fn.off{background:var(--surface2);color:var(--muted);border:1px solid var(--border);opacity:.45;text-decoration:line-through}
/* host boxes */
.host-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.host-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.host-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.host-name.KBANK,.host-name.Normal{color:var(--kbank-t)}
.host-name.DCC,.host-name.TPN,.host-name.SCB{color:#60a5fa}
.host-name.ALIPAY,.host-name.WECHAT{color:#f59e0b}
.host-name.UPI,.host-name.REDEEM,.host-name.REDEMPTION{color:#a78bfa}
.host-name.SmartPay,.host-name.SMART-PAY{color:#34d399}
.host-box .hl{display:flex;gap:6px;align-items:baseline;font-size:11px;margin-top:2px}
.host-box .hl span{color:var(--muted);min-width:26px;font-size:10px}
.host-box .hl b{font-family:var(--mono);color:var(--text);font-weight:500}
hr.d{border:none;border-top:1px solid var(--border)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:36px;margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text);margin-bottom:4px}
mark{background:rgba(79,124,255,.35);color:var(--text);border-radius:2px;padding:0 1px}
.limit-note{text-align:center;padding:14px;color:var(--muted);font-size:12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.lbar{height:2px;background:var(--accent);position:fixed;top:0;left:0;transition:width .3s;z-index:999}
@media(max-width:600px){.ig{grid-template-columns:1fr 1fr}.mer-lbl{display:none}.host-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="lbar" id="lb" style="width:0"></div>
<header>
  <div class="logo">EDC<span>Search</span></div>
  <div class="ub" id="ub">กำลังโหลด...</div>
</header>
<div class="sw">
  <div class="sb">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="q" placeholder="ค้นหา TID, MID, S/N, ชื่อร้าน..." autocomplete="off" spellcheck="false">
  </div>
  <div class="filters">
    <div class="pill aa loading" data-b="ALL">ทั้งหมด</div>
    <div class="pill loading" data-b="KBANK">KBANK</div>
    <div class="pill loading" data-b="WOM">WOM</div>
    <div class="pill loading" data-b="SCB">SCB</div>
    <div class="pill loading" data-b="BBL">BBL</div>
    <div class="pill loading" data-b="BAY">BAY</div>
  </div>
</div>
<div class="stats" id="stats"><span>กำลังโหลด...</span></div>
<div class="results" id="res">
  <div class="empty"><div class="ic">⏳</div><h3>กำลังโหลดข้อมูล</h3></div>
</div>
<script>
const BANKS=['KBANK','WOM','SCB','BBL','BAY'];
const BC={ALL:'aa',KBANK:'ak',WOM:'aw',SCB:'as',BBL:'ab',BAY:'ay'};
const LIMIT=50;
let DB={},loaded={},activeBank='ALL',lastUp={};

async function loadBank(b){
  try{
    const r=await fetch(`data_${b}.json?`+Date.now());
    const d=await r.json();
    DB[b]=d.records||[];
    lastUp[b]=d.updated||'';
    loaded[b]=true;
    document.querySelector(`[data-b="${b}"]`).classList.remove('loading');
    document.querySelector(`[data-b="${b}"]`).textContent=`${b} (${DB[b].length.toLocaleString()})`;
    const all=Object.values(DB).flat();
    const p=document.querySelector('[data-b="ALL"]');
    p.classList.remove('loading');
    p.textContent=`ทั้งหมด (${all.length.toLocaleString()})`;
    const dates=Object.values(lastUp).filter(Boolean);
    if(dates.length) document.getElementById('ub').textContent='อัพเดท: '+dates[0];
    const done=Object.keys(loaded).length;
    document.getElementById('lb').style.width=(done/BANKS.length*100)+'%';
    renderStats(); const q=document.getElementById('q').value.trim(); if(q) render();
  }catch(e){console.warn(b,e);}
}

function hl(t,q){
  if(!q||!t) return t||'';
  return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
}
function v(val,q){return val?`<span class="v">${hl(val,q)}</span>`:`<span class="v e">-</span>`}
function fn(label,on){return `<span class="fn ${on?'on':'off'}">${label}</span>`}

function hostBoxes(hosts,q){
  if(!hosts||!hosts.length) return '<span style="color:var(--muted);font-size:12px">ไม่มีข้อมูล</span>';
  return '<div class="host-grid">'+hosts.map(h=>`
    <div class="host-box">
      <div class="host-name ${h.name.replace(/[^a-zA-Z]/g,'')}">${h.name}</div>
      <div class="hl"><span>TID</span><b>${hl(h.tid,q)}</b></div>
      ${h.mid?`<div class="hl"><span>MID</span><b>${hl(h.mid,q)}</b></div>`:''}
    </div>`).join('')+'</div>';
}

function card(r,q){
  const isBAY=r.bank==='BAY', isBBL=r.bank==='BBL';

  // info
  const infoH=`
    <div class="ii"><label>TID</label>${v(r.tid,q)}</div>
    <div class="ii"><label>MID</label>${v(r.mid,q)}</div>
    <div class="ii"><label>S/N</label>${v(r.sn,q)}</div>
    <div class="ii"><label>Model</label>${v(r.model,q)}</div>
    <div class="ii"><label>SW Version</label>${v(r.sw,q)}</div>
    ${r.slip1?`<div class="ii"><label>Slip 1</label>${v(r.slip1,q)}</div>`:''}
    ${r.slip2?`<div class="ii"><label>Slip 2</label>${v(r.slip2,q)}</div>`:''}
    ${r.slip3?`<div class="ii"><label>Slip 3</label>${v(r.slip3,q)}</div>`:''}
    ${r.slip4?`<div class="ii"><label>Slip 4</label>${v(r.slip4,q)}</div>`:''}`;

  // network
  let netH='<div class="fn-row">';
  if(isBBL){
    netH+=fn('Force Settle: '+(r.force_settle||'-'), r.force_settle==='YES'||r.force_settle==='1');
    netH+=fn('Auto Settle: '+(r.auto_settle||'-'), r.auto_settle==='YES'||r.auto_settle==='1');
  } else {
    netH+=fn('Settle: '+(r.settle||'-'), !!r.settle);
    netH+=fn('Time: '+(r.time_settle||'-'), !!r.time_settle);
  }
  netH+=fn('จำนวนเงิน: '+(r.limit||'-'), !!r.limit);
  netH+=fn('LinkPOS', !!r.linkpos);
  if(r.erm!==undefined && r.erm!=='') netH+=fn('ERM', !!r.erm);
  if(isBAY){
    netH+=fn('IP Primary: '+(r.ip_pri||'-'), !!r.ip_pri);
    netH+=fn('IP Secondary: '+(r.ip_sec||'-'), !!r.ip_sec);
  } else {
    netH+=fn('IP: '+(r.ip||'-'), !!r.ip);
  }
  netH+=fn('Connection: '+(r.conn_type||'-'), !!r.conn_type);
  if(r.apn) netH+=fn('APN: '+r.apn, true);
  if(r.flow_wallet) netH+=fn('Flow: '+r.flow_wallet, true);
  netH+='</div>';

  // function
  let fnH='<div class="fn-row">';
  fnH+=fn('Keyin', r.keyin);
  fnH+=fn('Tip', r.tip);
  fnH+=fn('Pre-Auth', r.preauth);
  fnH+=fn('Offline', r.offline);
  fnH+=fn('Refund', r.refund);
  // biller — แสดงครั้งเดียว รวม BBL และ SCB
  const hasBiller = r.biller_name||r.biller_id||r.biller_id_ref1||r.biller_id_ref2;
  if(hasBiller){
    fnH+=`<div style="width:100%;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">`;
    if(r.biller_name) fnH+=`<span class="fn on">Biller Name: ${hl(r.biller_name,q)}</span>`;
    if(r.biller_id) fnH+=`<span class="fn on">Biller ID: ${hl(r.biller_id,q)}</span>`;
    if(r.biller_id_ref1) fnH+=`<span class="fn on">Biller ID REF1: ${hl(r.biller_id_ref1,q)}</span>`;
    if(r.biller_id_ref2) fnH+=`<span class="fn on">Biller ID REF2: ${hl(r.biller_id_ref2,q)}</span>`;
    fnH+=`</div>`;
  }
  fnH+='</div>';

  return `<div class="card">
  <div class="card-head">
    <span class="badge b-${r.bank}">${r.bank}</span>
    <span class="tid-lbl">TID: ${hl(r.tid,q)}</span>
    <span class="mer-lbl">${hl(r.slip1||'',q)}</span>
  </div>
  <div class="card-body">
    <div><div class="sec-title">📋 ข้อมูลเครื่อง</div><div class="ig">${infoH}</div></div>
    <hr class="d">
    <div><div class="sec-title">⚙️ Network &amp; Settle</div>${netH}</div>
    <div><div class="sec-title">🔧 Function</div>${fnH}</div>
    <hr class="d">
    <div><div class="sec-title">🏦 Host TID / MID ทั้งหมด</div>${hostBoxes(r.hosts,q)}</div>
  </div>
</div>`;
}

function getPool(){return activeBank==='ALL'?Object.values(DB).flat():DB[activeBank]||[];}

function filterDB(q){
  if(!q) return [];
  const ql=q.toLowerCase();
  return getPool().filter(r=>
    [r.tid,r.mid,r.sn,r.slip1,r.slip2,r.slip3,r.slip4,r.apn,r.ip,r.ip_pri,
     r.biller_id,r.biller_name,r.biller_id_ref1,r.biller_id_ref2]
      .some(x=>x&&x.toLowerCase().includes(ql))||
    (r.hosts||[]).some(h=>h.tid&&h.tid.toLowerCase().includes(ql)||h.mid&&h.mid.toLowerCase().includes(ql))
  );
}

function renderStats(){
  const pool=getPool();
  let s=`<span>Pool <strong>${pool.length.toLocaleString()}</strong></span>`;
  BANKS.forEach(b=>{const c=(DB[b]||[]).length; if(c) s+=`<span>${b} <strong>${c.toLocaleString()}</strong></span>`;});
  document.getElementById('stats').innerHTML=s;
}

function render(){
  const q=document.getElementById('q').value.trim();
  renderStats();
  const res=document.getElementById('res');
  if(!q){res.innerHTML='<div class="empty"><div class="ic">🔍</div><h3>พิมพ์เพื่อค้นหา</h3><p>TID · MID · S/N · ชื่อร้าน</p></div>';return;}
  const found=filterDB(q);
  if(!found.length){res.innerHTML=`<div class="empty"><div class="ic">😶</div><h3>ไม่พบ "${q}"</h3></div>`;return;}
  let html=found.slice(0,LIMIT).map(r=>card(r,q)).join('');
  if(found.length>LIMIT) html+=`<div class="limit-note">แสดง ${LIMIT} จาก ${found.length.toLocaleString()} รายการ</div>`;
  res.innerHTML=html;
}

document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  if(p.classList.contains('loading')) return;
  activeBank=p.dataset.b;
  document.querySelectorAll('.pill').forEach(x=>{
    const keep=x.classList.contains('loading')?['pill','loading']:['pill'];
    x.className=keep.join(' ');
    if(x.dataset.b===activeBank) x.classList.add(BC[activeBank]||'aa');
  });
  render();
}));

Promise.all(BANKS.map(b=>loadBank(b))).then(()=>{
  document.getElementById('lb').style.opacity='0';
  renderStats();
});
</script>
</body>
</html>
