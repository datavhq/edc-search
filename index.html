<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TermPoint — EDC Terminal Lookup</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',system-ui,sans-serif}
body{background:#f0f4fa;font-size:14px}

/* NAV */
.nav{background:linear-gradient(135deg,#0d2580,#1a4fc4,#2a7aee);padding:11px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.nav-icon{width:33px;height:33px;background:#f97316;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-brand{font-size:15px;font-weight:600;color:#fff;letter-spacing:-.2px}
.nav-brand span{color:#f97316}
.nav-sub{font-size:9px;color:#93c5fd;letter-spacing:1px;text-transform:uppercase}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.ndot{width:7px;height:7px;background:#4ade80;border-radius:50%}
.npill{font-size:11px;color:#bfdbfe;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}

/* HERO */
.hero{background:linear-gradient(160deg,#0d2580 0%,#1a4fc4 55%,#2a7aee 100%);padding:28px 20px 20px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.04);top:-80px;right:-50px;pointer-events:none}
.hero::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-60px;left:-40px;pointer-events:none}
.eye{font-size:10px;color:#93c5fd;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.eye::before,.eye::after{content:'';flex:1;max-width:48px;height:.5px;background:rgba(147,197,253,.4)}
.h1{font-size:24px;font-weight:600;color:#fff;letter-spacing:-.3px;margin-bottom:2px}
.h1 em{color:#f97316;font-style:normal;font-weight:700}
.h2{font-size:16px;color:#60a5fa;margin-bottom:7px;font-weight:400}
.hsub{font-size:12px;color:#93c5fd;margin-bottom:18px}
.so{max-width:520px;margin:0 auto;position:relative;z-index:2}
.sbox{background:#fff;border:2px solid #f97316;border-radius:10px;display:flex;align-items:center;padding:0 10px;height:44px;gap:8px}
.sbox input{border:none;outline:none;flex:1;font-size:14px;color:#0d2580;background:transparent;font-family:'Poppins',system-ui,sans-serif}
.sbox input::placeholder{color:#aac0d8}
.sbtn{background:#f97316;color:#fff;border:none;border-radius:7px;padding:6px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Poppins',system-ui,sans-serif;white-space:nowrap}
.sbtn:hover{background:#ea6a0a}
.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;position:relative;z-index:2}
.pill{border-radius:20px;padding:5px 16px;font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,.25);color:#bfdbfe;background:rgba(255,255,255,.1);cursor:pointer;transition:all .15s;user-select:none}
.pill:hover{background:rgba(255,255,255,.18)}
.pill.act{background:#f97316;border-color:#f97316;color:#fff}

/* STATS */
.stats{background:#fff;border-bottom:.5px solid #dce8f5;display:grid;grid-template-columns:repeat(6,1fr)}
.stat{padding:9px 6px;text-align:center;border-right:.5px solid #dce8f5}
.stat:last-child{border-right:none}
.sn{font-size:14px;font-weight:600;letter-spacing:-.3px}
.sl{font-size:10px;color:#aac0d8;margin-top:1px;font-weight:400}

/* RESULTS */
.res{padding:14px 16px;background:#f0f4fa;min-height:180px;max-width:1000px;margin:0 auto}
.rc{font-size:12px;color:#8aaac8;margin-bottom:10px;font-weight:400}
.limit-note{text-align:center;padding:12px;color:#8aaac8;font-size:12px;background:#fff;border-radius:8px;border:.5px solid #dce8f5;margin-top:8px}

/* CARD */
.card{background:#fff;border:1px solid #dce8f5;border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 16px rgba(26,79,196,.07)}
.ch{background:linear-gradient(135deg,#0d2580,#1a4fc4,#2a7aee);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk{font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;letter-spacing:.3px}
.bk-BBL{background:#064e91;color:#fff}
.bk-KBANK{background:#08a818;color:#fff}
.bk-WOM{background:#08a818;color:#fff}
.bk-SCB{background:#6308a8;color:#fff}
.bk-BAY{background:#c9ba2e;color:#fff}
.bk-KP{background:#f97316;color:#fff}
.tid-wrap{display:flex;align-items:center;gap:5px}
.tid-lbl{font-size:12px;color:rgba(255,255,255,.5);font-weight:400}
.tid-val{font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:#fff}
.shop-name{margin-left:auto;font-size:12px;color:#7dd4ff;font-weight:400;text-transform:uppercase;letter-spacing:.2px}

/* CARD BODY */
.cb{background:#fff}
.sec{padding:12px 14px;border-bottom:1px solid #eef2f8}
.sec:last-child{border-bottom:none}
.seclbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8aaac8;margin-bottom:8px;display:flex;align-items:center;gap:5px;font-weight:600}
.seclbl i{color:#f97316;font-size:13px}

/* INFO GRID */
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px 14px}
.ii label{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#aac0d8;display:block;margin-bottom:2px;font-weight:500}
.ii .vorg{font-size:12px;font-family:'JetBrains Mono',monospace;color:#f97316;font-weight:600}
.ii .vblue{font-size:12px;font-family:'JetBrains Mono',monospace;color:#1a4fc4;font-weight:500}
.ii .ve{font-size:11px;color:#aac0d8;font-style:italic}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:5px}
.ton{background:#eff6ff;color:#1a4fc4;font-size:11px;padding:2px 9px;border-radius:4px;border:.5px solid #bfdbfe;font-weight:500}
.tof{background:#fff7ed;color:#c2410c;font-size:11px;padding:2px 9px;border-radius:4px;border:.5px solid #fed7aa;font-weight:500}
.tno{background:#f8fafc;color:#c8d8e8;font-size:11px;padding:2px 9px;border-radius:4px;border:.5px solid #eef2f8;text-decoration:line-through}
.biller-row{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}

/* HOST GROUPS */
.gw{display:flex;flex-direction:column;gap:7px}
.grp{border-radius:10px;overflow:hidden;border:1px solid #dce8f5}
.gh{padding:7px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #dce8f5;background:#f5f8fc}
.glbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#1a4fc4}
.gcnt{font-size:10px;color:#aac0d8;margin-left:auto;font-weight:400}
.gbody{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;background:#f5f8fc}
.hbox{background:#fff;border:1px solid #dce8f5;border-radius:8px;padding:8px 10px}
.hn{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;color:#1a4fc4}
.hr{font-size:11px;color:#aac0d8;line-height:1.7}
.hr b{font-family:'JetBrains Mono',monospace;color:#07328a;font-weight:500}
.hr b.org{color:#f97316}

.grp-bay{border-color:#d4c94e}.gh-bay{background:#fefde8;border-color:#f3e87d}.glbl-bay{color:#9a8a00}
.grp-scb{border-color:#c4b5fd}.gh-scb{background:#f5f3ff;border-color:#ede9fe}.glbl-scb{color:#6308a8}
.grp-kbank{border-color:#86efac}.gh-kbank{background:#f0fdf4;border-color:#dcfce7}.glbl-kbank{color:#08a818}
.grp-ktc{border-color:#c4b5fd}.gh-ktc{background:#faf5ff;border-color:#f5f3ff}.glbl-ktc{color:#6d28d9}
.grp-kp{border-color:#fed7aa}.gh-kp{background:#fff7ed;border-color:#fed7aa}.glbl-kp{color:#c2410c}
.grp-bbl{border-color:#93c5fd}.gh-bbl{background:#eff6ff;border-color:#dbeafe}.glbl-bbl{color:#064e91}

/* EMPTY */
.empty{text-align:center;padding:36px 20px;color:#aac0d8}
.empty i{font-size:30px;display:block;margin-bottom:8px;color:#dce8f5}

/* RESPONSIVE */
@media(max-width:600px){
  .ig{grid-template-columns:1fr 1fr}
  .shop-name{display:none}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat:nth-child(3){border-right:none}
  .stat:nth-child(4){border-top:.5px solid #dce8f5}
  .gbody{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-icon"><i class="ti ti-device-laptop" style="color:#fff;font-size:17px"></i></div>
  <div>
    <div class="nav-brand">Term<span>Point</span></div>
    <div class="nav-sub">EDC Terminal Lookup</div>
  </div>
  <div class="nav-r">
    <div class="npill"><div class="ndot"></div>online</div>
    <div class="npill" id="clk"></div>
  </div>
</nav>

<div class="hero">
  <div class="eye">Terminal Knowledge Platform</div>
  <div class="h1">Find Any <em>Terminal.</em></div>
  <div class="h2">Instantly.</div>
  <div class="hsub">TID · MID · Serial Number · Shop name · across all banks</div>
  <div class="so">
    <div class="sbox">
      <i class="ti ti-search" style="font-size:17px;color:#aac0d8"></i>
      <input type="text" id="qi" placeholder="TID, MID, S/N, shop name..." autocomplete="off" spellcheck="false">
      <button class="sbtn" onclick="go()">Search</button>
    </div>
  </div>
  <div class="pills" id="pills">
    <div class="pill act" data-b="ALL">All</div>
    <div class="pill" data-b="KBANK">KBANK</div>
    <div class="pill" data-b="WOM">WOM</div>
    <div class="pill" data-b="SCB">SCB</div>
    <div class="pill" data-b="BBL">BBL</div>
    <div class="pill" data-b="BAY">BAY</div>
  </div>
</div>

<div class="stats" id="stats-bar">
  <div class="stat"><div class="sn" style="color:#1a4fc4" id="cnt-ALL">—</div><div class="sl">Total</div></div>
  <div class="stat"><div class="sn" style="color:#08a818" id="cnt-KBANK">—</div><div class="sl">KBANK</div></div>
  <div class="stat"><div class="sn" style="color:#08a818" id="cnt-WOM">—</div><div class="sl">WOM</div></div>
  <div class="stat"><div class="sn" style="color:#6308a8" id="cnt-SCB">—</div><div class="sl">SCB</div></div>
  <div class="stat"><div class="sn" style="color:#064e91" id="cnt-BBL">—</div><div class="sl">BBL</div></div>
  <div class="stat"><div class="sn" style="color:#c9ba2e" id="cnt-BAY">—</div><div class="sl">BAY</div></div>
</div>

<div class="res" id="res">
  <div class="empty"><i class="ti ti-search"></i></div>
</div>

<script>
const BANKS = ['KBANK','WOM','SCB','BBL','BAY'];
const LIMIT = 50;
let DB = {}, loaded = {}, activeBank = 'ALL';

const GMAP = {
  bay:  {cls:'grp-bay',  hcls:'gh-bay',   lcls:'glbl-bay',   lbl:'BAY Payment'},
  scb:  {cls:'grp-scb',  hcls:'gh-scb',   lcls:'glbl-scb',   lbl:'SCB'},
  kbank:{cls:'grp-kbank',hcls:'gh-kbank', lcls:'glbl-kbank', lbl:'KBANK'},
  ktc:  {cls:'grp-ktc',  hcls:'gh-ktc',   lcls:'glbl-ktc',   lbl:'KTC'},
  kp:   {cls:'grp-kp',   hcls:'gh-kp',    lcls:'glbl-kp',    lbl:'King Power'},
  bbl:  {cls:'grp-bbl',  hcls:'gh-bbl',   lcls:'glbl-bbl',   lbl:'BBL Payment'},
};

// ── Load data ──
async function loadBank(b) {
  try {
    const r = await fetch(`data_${b}.json?` + Date.now());
    const d = await r.json();
    DB[b] = d.records || [];
    loaded[b] = true;
    updateCounts();
    const q = document.getElementById('qi').value.trim();
    if (q) render();
  } catch(e) { console.warn(b, e); }
}

function updateCounts() {
  const total = Object.values(DB).flat().length;
  document.getElementById('cnt-ALL').textContent = total.toLocaleString();
  BANKS.forEach(b => {
    const el = document.getElementById(`cnt-${b}`);
    if (el && DB[b]) el.textContent = DB[b].length.toLocaleString();
  });
}

// ── Helpers ──
function hl(t, q) {
  if (!q || !t) return t || '';
  return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark style="background:rgba(249,115,22,.2);color:#c2410c;border-radius:2px">${m}</mark>`);
}
function fn(lbl, on) { return `<span class="${on?'tof':'tno'}">${lbl}</span>`; }
function v(val, q, cls='vblue') { return val ? `<span class="${cls}">${hl(val,q)}</span>` : `<span class="ve">—</span>`; }

function hostGroups(groups) {
  if (!groups || !groups.length) return '<span style="color:#aac0d8;font-size:12px">ไม่มีข้อมูล</span>';
  return '<div class="gw">' + groups.map(g => {
    const m = GMAP[g.key] || GMAP.bay;
    return `<div class="grp ${m.cls}">
<div class="gh ${m.hcls}">
  <i class="ti ti-building-bank" style="font-size:12px;color:#aac0d8"></i>
  <span class="glbl ${m.lcls}">${m.lbl}</span>
  <span class="gcnt">${g.hosts.length} hosts</span>
</div>
<div class="gbody">${g.hosts.map(h => `<div class="hbox">
  <div class="hn">${h.name}</div>
  <div class="hr">TID <b class="${h.is_main?'org':''}">${h.tid||'—'}</b></div>
  ${h.mid ? `<div class="hr">MID <b>${h.mid}</b></div>` : ''}
</div>`).join('')}</div>
</div>`;
  }).join('') + '</div>';
}

function buildHostGroups(r) {
  // group hosts by their 'group' field
  const groups = {};
  const order = [];
  (r.hosts || []).forEach(h => {
    const g = h.group || 'bay';
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(h);
  });
  return order.map(k => ({ key: k, hosts: groups[k] }));
}

function card(r, q) {
  const hg = r.host_groups || buildHostGroups(r);
  const isMain = r.tid;

  const billerRow = (r.biller_name || r.biller_id || r.biller_id_ref1 || r.biller_id_ref2)
    ? `<div class="biller-row">
        ${r.biller_name ? `<span class="tof">Biller Name: ${hl(r.biller_name,q)}</span>` : ''}
        ${r.biller_id ? `<span class="tof">Biller ID: ${hl(r.biller_id,q)}</span>` : ''}
        ${r.biller_id_ref1 ? `<span class="tof">Biller ID REF1: ${hl(r.biller_id_ref1,q)}</span>` : ''}
        ${r.biller_id_ref2 ? `<span class="tof">Biller ID REF2: ${hl(r.biller_id_ref2,q)}</span>` : ''}
      </div>` : '';

  return `<div class="card">
<div class="ch">
  <span class="bk bk-${r.bank}">${r.bank}</span>
  <div class="tid-wrap">
    <span class="tid-lbl">TID:</span>
    <span class="tid-val">${hl(r.tid,q)}</span>
  </div>
  <span class="shop-name">${hl(r.slip1||'',q)}</span>
</div>
<div class="cb">
  <div class="sec">
    <div class="seclbl"><i class="ti ti-cpu"></i>ข้อมูลเครื่อง</div>
    <div class="ig">
      <div class="ii"><label>TID</label>${v(r.tid,q,'vorg')}</div>
      <div class="ii"><label>MID</label>${v(r.mid,q)}</div>
      <div class="ii"><label>S/N</label>${v(r.sn,q)}</div>
      <div class="ii"><label>Model</label>${v(r.model,q)}</div>
      <div class="ii"><label>SW Version</label>${r.sw&&r.sw!=='-'?v(r.sw,q):`<span class="ve">—</span>`}</div>
      ${r.slip1?`<div class="ii"><label>Slip 1</label>${v(r.slip1,q)}</div>`:''}
      ${r.slip2?`<div class="ii"><label>Slip 2</label>${v(r.slip2,q)}</div>`:''}
      ${r.slip3?`<div class="ii"><label>Slip 3</label>${v(r.slip3,q)}</div>`:''}
      ${r.slip4?`<div class="ii"><label>Slip 4</label>${v(r.slip4,q)}</div>`:''}
    </div>
  </div>
  <div class="sec">
    <div class="seclbl"><i class="ti ti-wifi"></i>Network & Settle</div>
    <div class="tags">
      ${r.settle?`<span class="ton">${r.settle}</span>`:''}
      ${r.time_settle?`<span class="ton">Time: ${r.time_settle}</span>`:''}
      ${r.limit?`<span class="ton">จำนวนเงิน: ${r.limit}</span>`:''}
      ${r.force_settle?`<span class="ton">Force Settle: ${r.force_settle}</span>`:''}
      ${r.auto_settle?`<span class="ton">Auto Settle: ${r.auto_settle}</span>`:''}
      <span class="${r.linkpos?'ton':'tno'}">LinkPOS</span>
      ${r.erm!==undefined&&r.erm!==''?`<span class="${r.erm?'ton':'tno'}">ERM</span>`:''}
      ${(r.ip_pri||r.ip)?`<span class="ton">IP Primary: ${r.ip_pri||r.ip}</span>`:''}
      ${r.ip_sec?`<span class="ton">IP Secondary: ${r.ip_sec}</span>`:''}
      ${r.conn_type?`<span class="ton">Connection: ${r.conn_type}</span>`:''}
      ${r.apn?`<span class="ton">APN: ${r.apn}</span>`:''}
      ${r.flow_wallet?`<span class="ton">Flow: ${r.flow_wallet}</span>`:''}
    </div>
  </div>
  <div class="sec">
    <div class="seclbl"><i class="ti ti-settings-2"></i>Function</div>
    <div class="tags">
      ${fn('Keyin',r.keyin)}${fn('Tip',r.tip)}${fn('Pre-Auth',r.preauth)}${fn('Offline',r.offline)}${fn('Refund',r.refund)}
    </div>
    ${billerRow}
  </div>
  <div class="sec">
    <div class="seclbl"><i class="ti ti-building-bank"></i>Host TID / MID ทั้งหมด</div>
    ${hostGroups(hg)}
  </div>
</div>
</div>`;
}

// ── Filter ──
function getPool() {
  return activeBank === 'ALL' ? Object.values(DB).flat() : (DB[activeBank] || []);
}

function filterDB(q) {
  if (!q) return [];
  const ql = q.toLowerCase();
  return getPool().filter(r =>
    [r.tid,r.mid,r.sn,r.slip1,r.slip2,r.slip3,r.slip4,r.ip,r.ip_pri,r.biller_id,r.biller_name]
      .some(x => x && x.toLowerCase().includes(ql)) ||
    (r.hosts||[]).some(h => (h.tid||'').includes(ql)||(h.mid||'').includes(ql))
  );
}

// ── Render ──
function render() {
  const q = document.getElementById('qi').value.trim();
  const res = document.getElementById('res');
  if (!q) {
    res.innerHTML = '<div class="empty"><i class="ti ti-search"></i></div>';
    return;
  }
  const found = filterDB(q);
  if (!found.length) {
    res.innerHTML = `<div class="empty"><i class="ti ti-mood-empty"></i><div style="font-size:13px;margin-top:6px">ไม่พบ "${q}"</div></div>`;
    return;
  }
  const shown = found.slice(0, LIMIT);
  let html = `<div class="rc">พบ ${found.length.toLocaleString()} รายการ</div>` + shown.map(r => card(r, q)).join('');
  if (found.length > LIMIT) html += `<div class="limit-note">แสดง ${LIMIT} จาก ${found.length.toLocaleString()} รายการ — พิมพ์ให้เจาะจงขึ้น</div>`;
  res.innerHTML = html;
}

// ── Events ──
document.getElementById('qi').addEventListener('input', render);
document.getElementById('qi').addEventListener('keydown', e => { if (e.key === 'Enter') render(); });

document.getElementById('pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  activeBank = pill.dataset.b;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('act'));
  pill.classList.add('act');
  render();
});

// ── Clock ──
function tick() {
  const n = new Date();
  document.getElementById('clk').textContent = n.toISOString().slice(0,10) + ' · ' + n.toTimeString().slice(0,5);
}
tick(); setInterval(tick, 30000);

// ── Init ──
Promise.all(BANKS.map(loadBank));
</script>
</body>
</html>
