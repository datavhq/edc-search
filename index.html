<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDC Search</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3347;
  --text:#e8eaf2;--muted:#7b82a0;--accent:#4f7cff;--mono:'JetBrains Mono','Courier New',monospace;
  --kbank:#1e8a4a;--kbank-bg:#0d2e1a;--kbank-t:#4dbb78;
  --wom:#7c3aed;--wom-bg:#1e1040;--wom-t:#a78bfa;
  --scb:#4a3fb5;--scb-bg:#1a1650;--scb-t:#9b8fff;
  --bbl:#b54040;--bbl-bg:#2e1515;--bbl-t:#f07070;
  --bay:#c47c1e;--bay-bg:#2e1f0a;--bay-t:#f0a840;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:700;color:var(--accent)}.logo span{color:var(--text)}
.update-badge{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface2);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.search-wrap{padding:20px 20px 12px;max-width:960px;margin:0 auto}
.search-box{position:relative}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px 12px 44px;font-size:15px;color:var(--text);outline:none;transition:border-color .15s}
#q::placeholder{color:var(--muted)}#q:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{cursor:pointer;border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);transition:all .15s;user-select:none}
.pill.ak{background:var(--kbank-bg);border-color:var(--kbank);color:var(--kbank-t)}
.pill.aw{background:var(--wom-bg);border-color:var(--wom);color:var(--wom-t)}
.pill.as{background:var(--scb-bg);border-color:var(--scb);color:var(--scb-t)}
.pill.ab{background:var(--bbl-bg);border-color:var(--bbl);color:var(--bbl-t)}
.pill.ay{background:var(--bay-bg);border-color:var(--bay);color:var(--bay-t)}
.pill.aa{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{max-width:960px;margin:0 auto;padding:0 20px 10px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.stats strong{color:var(--text)}
.results{max-width:960px;margin:0 auto;padding:0 20px 40px;display:flex;flex-direction:column;gap:10px}
/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;letter-spacing:.5px}
.b-KBANK{background:var(--kbank-bg);color:var(--kbank-t);border:1px solid var(--kbank)}
.b-WOM{background:var(--wom-bg);color:var(--wom-t);border:1px solid var(--wom)}
.b-SCB{background:var(--scb-bg);color:var(--scb-t);border:1px solid var(--scb)}
.b-BBL{background:var(--bbl-bg);color:var(--bbl-t);border:1px solid var(--bbl)}
.b-BAY{background:var(--bay-bg);color:var(--bay-t);border:1px solid var(--bay)}
.tid-lbl{font-size:15px;font-weight:700;font-family:var(--mono)}
.mer-lbl{margin-left:auto;font-size:12px;color:var(--muted)}
/* sections */
.card-body{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;font-weight:600}
/* info grid */
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 16px}
.ii label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:1px}
.ii span{font-size:12px;font-weight:500;font-family:var(--mono);color:var(--text);word-break:break-all}
.ii span.e{color:var(--muted);font-family:inherit;font-weight:400;font-style:italic;font-size:11px}
/* function pills */
.fn-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fn{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.fn.on{background:rgba(79,124,255,.18);color:#7da4ff;border:1px solid rgba(79,124,255,.3)}
.fn.off{background:var(--surface2);color:var(--muted);border:1px solid var(--border);text-decoration:line-through;opacity:.5}
/* hosts table */
.host-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 12px}
.hi{display:flex;gap:6px;align-items:baseline;font-size:12px}
.hi .hk{color:var(--muted);min-width:120px;font-size:11px}
.hi .hv{font-family:var(--mono);color:var(--text)}
.hi .hv.dash{color:var(--muted);opacity:.4}
/* divider */
hr.d{border:none;border-top:1px solid var(--border)}
/* empty */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:36px;margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text);margin-bottom:4px}
mark{background:rgba(79,124,255,.35);color:var(--text);border-radius:2px;padding:0 1px}
.limit-note{text-align:center;padding:14px;color:var(--muted);font-size:12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
@media(max-width:600px){.ig{grid-template-columns:1fr 1fr}.mer-lbl{display:none}.host-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">EDC<span>Search</span></div>
  <div class="update-badge" id="ub">กำลังโหลด...</div>
</header>
<div class="search-wrap">
  <div class="search-box">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="q" placeholder="ค้นหา TID, MID, S/N, ชื่อร้าน..." autocomplete="off" spellcheck="false">
  </div>
  <div class="filters">
    <div class="pill aa" data-b="ALL">ทั้งหมด</div>
    <div class="pill" data-b="KBANK">KBANK</div>
    <div class="pill" data-b="WOM">WOM</div>
    <div class="pill" data-b="SCB">SCB</div>
    <div class="pill" data-b="BBL">BBL</div>
    <div class="pill" data-b="BAY">BAY</div>
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="results" id="res">
  <div class="empty"><div class="ic">🔍</div><h3>พิมพ์เพื่อค้นหา</h3><p>TID · MID · S/N · ชื่อร้าน</p></div>
</div>
<script>
let DB=[], bank='ALL';
const LIMIT=50;

async function load(){
  try{
    const r=await fetch('data.json?'+Date.now());
    const d=await r.json();
    DB=d.records||[];
    document.getElementById('ub').textContent='อัพเดท: '+(d.updated||'-');
    renderStats('');
  }catch(e){
    document.getElementById('res').innerHTML='<div class="empty"><div class="ic">⚠️</div><h3>โหลดไม่สำเร็จ</h3><p>ตรวจสอบ data.json</p></div>';
  }
}

function hl(t,q){
  if(!q||!t) return t||'';
  return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
}

function val(v,q){return v?`<span>${hl(v,q)}</span>`:`<span class="e">-</span>`}

function fnTag(label,on){return `<span class="fn ${on?'on':'off'}">${label}</span>`}

function hostRows(hosts,q){
  const entries=Object.entries(hosts).filter(([k,v])=>v&&v!=='-'&&v!=='0');
  if(!entries.length) return '<span class="e" style="font-size:12px">ไม่มีข้อมูล</span>';
  return '<div class="host-grid">'+entries.map(([k,v])=>{
    const dash=v==='-';
    return `<div class="hi"><span class="hk">${k}</span><span class="hv ${dash?'dash':''}">${hl(v,q)}</span></div>`;
  }).join('')+'</div>';
}

function card(r,q){
  const isWOM=r.bank==='WOM';
  const isBAY=r.bank==='BAY';
  const isBBL=r.bank==='BBL';
  const isSCB=r.bank==='SCB';

  // ── Info fields ──
  let infoHtml=`
    <div class="ii"><label>TID</label>${val(r.tid,q)}</div>
    <div class="ii"><label>MID</label>${val(r.mid,q)}</div>
    <div class="ii"><label>S/N</label>${val(r.sn,q)}</div>
    <div class="ii"><label>Slip Line 1</label>${val(r.slip1,q)}</div>
    <div class="ii"><label>Slip Line 2</label>${val(r.slip2,q)}</div>
    <div class="ii"><label>Slip Line 3</label>${val(r.slip3,q)}</div>
    <div class="ii"><label>Model</label>${val(r.model,q)}</div>
    <div class="ii"><label>SW Version</label>${val(r.sw,q)}</div>`;

  // ── Function section ──
  let fnHtml='<div class="fn-row">';
  fnHtml+=fnTag('Settle: '+(r.settle_mode||'-'), !!r.settle_mode);
  fnHtml+=fnTag('Time: '+(r.time_settle||'-'), !!r.time_settle);
  fnHtml+=fnTag('หลักล้าน: '+(r.control_limit||'-'), !!r.control_limit);
  fnHtml+=fnTag('LinkPOS', r.linkpos);
  fnHtml+=fnTag('IP: '+(r.ip||'-'), !!r.ip);
  if(!isBAY&&!isBBL&&!isSCB){
    fnHtml+=fnTag('APN: '+(r.apn||'-'), !!r.apn);
  }
  fnHtml+=fnTag('SIM: '+(r.tel_system||'-'), !!r.tel_system);
  fnHtml+='</div>';

  let fn2Html='<div class="fn-row">';
  fn2Html+=fnTag('Keyin', r.keyin);
  fn2Html+=fnTag('Tip', r.tip);
  fn2Html+=fnTag('Card Ver', r.cardver);
  fn2Html+=fnTag('Offline', r.offline);
  fn2Html+=fnTag('Refund', r.refund);
  if(!isBAY&&!isBBL&&!isSCB){
    fn2Html+=fnTag('Flow Wallet: '+(r.flow_wallet||'-'), !!r.flow_wallet);
  }
  fn2Html+=fnTag('Multi', r.multi);
  fn2Html+=fnTag('Dynamic Offline', r.dynamic_offline);
  if(isWOM && r.lounge!==undefined){
    fn2Html+=fnTag('Lounge', r.lounge);
  }
  fn2Html+='</div>';

  const merchant=r.slip1||r.mid||'';

  return `<div class="card">
  <div class="card-head">
    <span class="badge b-${r.bank}">${r.bank}</span>
    <span class="tid-lbl">TID: ${hl(r.tid,q)}</span>
    <span class="mer-lbl">${hl(merchant,q)}</span>
  </div>
  <div class="card-body">
    <div>
      <div class="section-title">📋 ข้อมูลเครื่อง</div>
      <div class="ig">${infoHtml}</div>
    </div>
    <hr class="d">
    <div>
      <div class="section-title">⚙️ Network &amp; Settle</div>
      ${fnHtml}
    </div>
    <div>
      <div class="section-title">🔧 Function</div>
      ${fn2Html}
    </div>
    <hr class="d">
    <div>
      <div class="section-title">🏦 Host TID / MID ทั้งหมด</div>
      ${hostRows(r.hosts||{},q)}
    </div>
  </div>
</div>`;
}

function renderStats(q){
  const pool=bank==='ALL'?DB:DB.filter(r=>r.bank===bank);
  const counts={};
  DB.forEach(r=>counts[r.bank]=(counts[r.bank]||0)+1);
  let s=`<span>ทั้งหมด <strong>${DB.length.toLocaleString()}</strong></span>`;
  ['KBANK','WOM','SCB','BBL','BAY'].forEach(b=>{
    if(counts[b]) s+=`<span>${b} <strong>${counts[b].toLocaleString()}</strong></span>`;
  });
  if(q){const found=filterDB(q).length; s=`พบ <strong>${found.toLocaleString()}</strong> รายการ `+s;}
  document.getElementById('stats').innerHTML=s;
}

function filterDB(q){
  const ql=q.toLowerCase();
  const pool=bank==='ALL'?DB:DB.filter(r=>r.bank===bank);
  if(!ql) return [];
  return pool.filter(r=>
    (r.tid&&r.tid.toLowerCase().includes(ql))||
    (r.mid&&r.mid.toLowerCase().includes(ql))||
    (r.sn&&r.sn.toLowerCase().includes(ql))||
    (r.slip1&&r.slip1.toLowerCase().includes(ql))||
    (r.slip2&&r.slip2.toLowerCase().includes(ql))||
    (r.slip3&&r.slip3.toLowerCase().includes(ql))||
    (r.apn&&r.apn.toLowerCase().includes(ql))||
    Object.values(r.hosts||{}).some(v=>v&&v.toLowerCase().includes(ql))
  );
}

function render(){
  const q=document.getElementById('q').value.trim();
  renderStats(q);
  const res=document.getElementById('res');
  if(!q){
    res.innerHTML='<div class="empty"><div class="ic">🔍</div><h3>พิมพ์เพื่อค้นหา</h3><p>TID · MID · S/N · ชื่อร้าน</p></div>';
    return;
  }
  const found=filterDB(q);
  if(!found.length){
    res.innerHTML=`<div class="empty"><div class="ic">😶</div><h3>ไม่พบ "${q}"</h3><p>ลองค้นหาด้วย TID / MID / S/N / ชื่อร้าน</p></div>`;
    return;
  }
  const shown=found.slice(0,LIMIT);
  let html=shown.map(r=>card(r,q)).join('');
  if(found.length>LIMIT) html+=`<div class="limit-note">แสดง ${LIMIT} จาก ${found.length.toLocaleString()} รายการ — พิมพ์ให้เจาะจงขึ้น</div>`;
  res.innerHTML=html;
}

document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  bank=p.dataset.b;
  document.querySelectorAll('.pill').forEach(x=>{
    x.className='pill';
    if(x.dataset.b===bank){
      const cls={ALL:'aa',KBANK:'ak',WOM:'aw',SCB:'as',BBL:'ab',BAY:'ay'};
      x.classList.add(cls[bank]||'aa');
    }
  });
  render();
}));

load();
</script>
</body>
</html>
